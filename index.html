<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9f4ff"><title>你那边呢</title><body style="margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#eaf6ff,#f5e9ff 55%,#fff0f5);font-family:system-ui,-apple-system,'PingFang SC',sans-serif;color:#233"><div id="msg" style="text-align:center;padding:24px"><div style="font-size:28px">你那边呢</div><p>正在载入页面…</p></div><script>(async()=>{try{const files=Array.from({length:16},(_,i)=>'v2-part-'+String(i).padStart(2,'0')+'.txt');const parts=await Promise.all(files.map(async f=>{const r=await fetch(f+'?rev=3');if(!r.ok)throw new Error('页面数据载入失败');return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.getElementById('msg').innerHTML='<div style="font-size:24px">页面暂时无法载入</div><p>请刷新页面后重试。</p>'}})();</script></body></html>
